name: CI/CD - Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: modern-saga-472703-k3
  GKE_CLUSTER: test-demo-cluster
  GKE_ZONE: us-central1-a
  IMAGE: gcr.io/modern-saga-472703-k3/mongo-db

jobs:
  # ----------------------------
  # CI PHASE
  # ----------------------------
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for lint/test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install lint tools
        run: |
          pip install yamllint

  lint_yaml:
    name: YAML Lint Check
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Kubernetes YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: k8s/
          strict: false

  test_config:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: lint_yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dry-run Kubernetes configs
        run: |
          kubectl apply --dry-run=client -f k8s/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test_config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA .

  push_artifacts:
    name: Push Docker Image to GCR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Push Docker Image
        run: |
          docker tag $IMAGE:$GITHUB_SHA $IMAGE:latest
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

  # ----------------------------
  # CD PHASE
  # ----------------------------
  deploy_gke:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: push_artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $PROJECT_ID

      - name: Deploy MongoDB to GKE
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false
          kubectl rollout status deployment/mongo-deployment || true
          kubectl get pods -l app=mongo
          kubectl get svc mongo-service -o wide
