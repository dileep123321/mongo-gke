name: MongoDB CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # -------------------- CI STAGES --------------------
  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl and gcloud
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl

  linting:
    name: YAML Lint Check
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Kubernetes YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml
          file_or_dir: k8s/

  build:
    name: Validate MongoDB Deployment Files
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate K8s YAML
        run: |
          kubectl apply --dry-run=client -f k8s/mongo-configmap.yaml
          kubectl apply --dry-run=client -f k8s/mongo-secret.yaml
          kubectl apply --dry-run=client -f k8s/mongo-pvc.yaml
          kubectl apply --dry-run=client -f k8s/mongo-deployment.yaml
          kubectl apply --dry-run=client -f k8s/mongo-service.yaml

  push_artifacts:
    name: Package K8s Files (Optional)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Artifact ZIP
        run: |
          mkdir artifact
          cp -r k8s artifact/
          cd artifact
          zip -r mongo-manifests.zip .
          cd ..
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongo-k8s-manifests
          path: artifact/mongo-manifests.zip

  # -------------------- CD STAGES --------------------
  deploy_gke:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: push_artifacts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Deploy MongoDB to GKE
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false

      - name: Verify Deployment
        run: |
          echo "Checking MongoDB Pod and Service Status..."
          kubectl get pods -l app=mongodb
          kubectl get svc -l app=mongodb

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy_gke
    steps:
      - name: Notify Success
        run: echo "✅ MongoDB successfully deployed to GKE!"
