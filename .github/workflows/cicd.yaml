name: Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

jobs:
  ############################################################
  # 1️⃣ LINTING - Check YAML syntax and structure
  ############################################################
  lint:
    name: Lint Kubernetes YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint

      - name: Run YAML linting
        run: yamllint k8s/

  ############################################################
  # 2️⃣ TRIVY CONFIG SCAN - Scan Kubernetes YAMLs for security issues
  ############################################################
  trivy_config_scan:
    name: Trivy Config Scan (Kubernetes Manifests)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./k8s
          severity: HIGH,CRITICAL

  ############################################################
  # 3️⃣ VALIDATION - Dry-run to verify manifest correctness
  ############################################################
  validate_k8s:
    name: Validate Kubernetes Manifests (Dry Run)
    runs-on: ubuntu-latest
    needs: trivy_config_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y kubectl

      - name: Validate Kubernetes YAMLs
        run: |
          kubectl apply --dry-run=client -f k8s/

  ############################################################
  # 4️⃣ DEPLOY - Apply manifests to GKE
  ############################################################
  deploy:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: validate_k8s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Deploy MongoDB to GKE
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false
          kubectl get pods -o wide
          kubectl get svc -o wide

  ############################################################
  # 5️⃣ HEALTH CHECK - Verify MongoDB pod readiness post-deployment
  ############################################################
  health_check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Check MongoDB Pod Status
        run: |
          echo "Waiting for MongoDB pod to be ready..."
          kubectl wait --for=condition=Ready pod -l app=mongo --timeout=180s
          echo "Pods:"
          kubectl get pods -l app=mongo
          echo "Logs:"
          kubectl logs -l app=mongo --tail=10
