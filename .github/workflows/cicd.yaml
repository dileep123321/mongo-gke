name: CI/CD Pipeline - MongoDB on GKE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: modern-saga-472703-k3
  GKE_CLUSTER: test-demo-cluster
  GKE_ZONE: us-central1-a

jobs:
  # --------------------------------------------------------
  # 🧩 CI SECTION
  # --------------------------------------------------------

  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  dependencies:
    name: Install Linting Tools
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install yamllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint

  linting:
    name: YAML Lint Check
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run YAML Linter
        run: |
          echo "Running yamllint on k8s/ folder..."
          yamllint k8s/

  # --------------------------------------------------------
  # 🚀 CD SECTION
  # --------------------------------------------------------

  deploy_gke:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE --project $PROJECT_ID

      - name: Deploy MongoDB Manifests
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false

      - name: Verify Deployment
        run: |
          kubectl get pods -l app=mongo
          kubectl get svc mongo-service -o wide
