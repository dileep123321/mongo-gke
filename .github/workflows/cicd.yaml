name: Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: modern-saga-472703-k3
  GKE_CLUSTER: test-demo-cluster
  GKE_ZONE: us-central1-a

jobs:
  # ---------------------------
  # CI STAGE
  # ---------------------------

  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install YAML Linter
        run: pip install yamllint

  linting:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run YAML lint
        run: yamllint k8s/

  # ---------------------------
  # CD STAGE
  # ---------------------------

  deploy_gke:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $PROJECT_ID

      - name: Deploy MongoDB to GKE
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false
          kubectl get pods -l app=mongodb
          kubectl get svc mongo-service -o wide
