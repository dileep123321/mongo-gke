name: Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

jobs:
  # ------------------------------
  # 1️⃣ YAML LINT STAGE
  # ------------------------------
  lint:
    name: Lint Kubernetes YAMLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: ./k8s

  # ------------------------------
  # 2️⃣ VALIDATE MANIFESTS
  # ------------------------------
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y kubectl

      - name: Validate YAML Syntax
        run: |
          kubectl apply --dry-run=client -f k8s/ --validate=false

  # ------------------------------
  # 3️⃣ SECURITY CHECK
  # ------------------------------
  security-check:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for secrets in YAML
        run: |
          echo "Scanning for possible secrets..."
          if grep -R "password:" k8s/ || grep -R "secret" k8s/; then
            echo "⚠️ Warning: Potential secret detected!"
          else
            echo "✅ No sensitive data found."
          fi

  # ------------------------------
  # 4️⃣ BUILD CONFIGMAPS (OPTIONAL)
  # ------------------------------
  build-configmap:
    name: Build ConfigMap Stage
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare ConfigMap
        run: |
          echo "Preparing MongoDB ConfigMap..."
          mkdir -p k8s/generated
          cat <<EOF > k8s/generated/mongo-configmap.yaml
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mongo-config
          data:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password123
          EOF
          echo "✅ ConfigMap generated successfully"

  # ------------------------------
  # 5️⃣ DEPLOY TO GKE
  # ------------------------------
  deploy:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: build-configmap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Deploy MongoDB Resources
        run: |
          kubectl apply -f k8s/ --validate=false
          kubectl apply -f k8s/generated/mongo-configmap.yaml --validate=false

  # ------------------------------
  # 6️⃣ VERIFY DEPLOYMENT
  # ------------------------------
  verify:
    name: Verify MongoDB Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Authenticate to GKE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Get Cluster Credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Check Pods and Services
        run: |
          echo "🔍 Checking MongoDB pods..."
          kubectl get pods -l app=mongo
          echo "🔍 Checking MongoDB services..."
          kubectl get svc -l app=mongo

  # ------------------------------
  # 7️⃣ HEALTH CHECK STAGE
  # ------------------------------
  health-check:
    name: MongoDB Health Check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Authenticate to GKE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Health Check MongoDB Pod
        run: |
          POD=$(kubectl get pod -l app=mongo -o jsonpath="{.items[0].metadata.name}")
          kubectl exec $POD -- mongo --eval "db.runCommand({ ping: 1 })"
          echo "✅ MongoDB is healthy and responding."

  # ------------------------------
  # 8️⃣ CLEANUP STAGE
  # ------------------------------
  cleanup:
    name: Cleanup Workspace
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Clean up temporary files
        run: |
          echo "🧹 Cleaning up workspace..."
          rm -rf k8s/generated
          echo "✅ Cleanup completed successfully."
