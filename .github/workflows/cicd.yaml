name: Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

jobs:
  # -------------------------------
  # 1️⃣ YAML Linting
  # -------------------------------
  lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Run yamllint
        run: yamllint k8s/

  # -------------------------------
  # 2️⃣ Trivy Config Scan
  # -------------------------------
  trivy_config_scan:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.21.0
        with:
          scan-type: config
          scanners: config
          hide-progress: true
          ignore-unfixed: true
          exit-code: 0
          path: ./k8s

  # -------------------------------
  # 3️⃣ Validate Kubernetes Manifests
  # -------------------------------
  validate_k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: trivy_config_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes YAMLs (dry-run)
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/

  # -------------------------------
  # 4️⃣ Deploy to GKE
  # -------------------------------
  deploy:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: validate_k8s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Deploy MongoDB to GKE
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false
          kubectl get pods
          kubectl get svc

  # -------------------------------
  # 5️⃣ Health Check
  # -------------------------------
  health_check:
    name: Health Check (Post-Deployment)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Verify MongoDB Pod & Service
        run: |
          echo "Verifying MongoDB Deployment..."
          kubectl get pods -l app=mongo
          kubectl get svc mongo-service
