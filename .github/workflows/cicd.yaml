name: Deploy MongoDB to GKE

on:
  push:
    branches:
      - main

jobs:
  # -------------------------------
  # 1️⃣ YAML Linting Stage
  # -------------------------------
  lint:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Kubernetes YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: k8s/
          config_file: .yamllint.yml

  # -------------------------------
  # 2️⃣ Validate K8s Manifests (Dry Run)
  # -------------------------------
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate K8s YAML syntax
        run: |
          kubectl apply --dry-run=client -f k8s/ --validate=false
        continue-on-error: false

  # -------------------------------
  # 3️⃣ Authenticate and Configure GCP
  # -------------------------------
  setup:
    name: Configure GCP and GKE
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

  # -------------------------------
  # 4️⃣ Deploy MongoDB to GKE
  # -------------------------------
  deploy:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: modern-saga-472703-k3
          export_default_credentials: true

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials test-demo-cluster \
            --zone us-central1-a --project modern-saga-472703-k3

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/mongo-configmap.yaml --validate=false
          kubectl apply -f k8s/mongo-secret.yaml --validate=false
          kubectl apply -f k8s/mongo-pvc.yaml --validate=false
          kubectl apply -f k8s/mongo-deployment.yaml --validate=false
          kubectl apply -f k8s/mongo-service.yaml --validate=false

      - name: Verify MongoDB Deployment
        run: |
          kubectl get pods -l app=mongo
          kubectl get svc -l app=mongo
          kubectl rollout status deployment/mongo

  # -------------------------------
  # 5️⃣ Post-deployment Health Check
  # -------------------------------
  health-check:
    name: Health Check MongoDB
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify MongoDB Pod Health
        run: |
          POD_NAME=$(kubectl get pods -l app=mongo -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -it $POD_NAME -- mongo --eval "db.runCommand({ ping: 1 })"
